name: chinese_srs_app
description: "App đọc văn bản tiếng Trung mỗi ngày theo phương pháp lặp lại ngắt quãng (Spaced Repetition)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI cơ bản, icon
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Firebase Auth (đăng nhập / đăng ký)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Local storage (lưu bài đọc, tiến trình SRS, từ điển mini)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Gọi API ngoài lấy thêm bài đọc
  http: ^1.2.2

  # Tính pinyin tự động cho chữ Hán không có sẵn trong từ điển mini
  pinyin: ^3.2.0

  # Thông báo nhắc học hằng ngày
  flutter_local_notifications: ^18.0.1

  # Đọc file JSON từ assets (bài mẫu, từ điển mini) lúc khởi tạo lần đầu
  # (dùng luôn API JSON có sẵn của Dart nên không cần thêm package ở đây)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/sample_passages.json
    - assets/data/mini_dictionary.json
